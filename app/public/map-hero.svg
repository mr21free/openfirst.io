<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="A hand-drawn map of a family's world: the home, the safe, the bank, the cabin — connected by a route that starts at one envelope.">
  <!--
    "Start with the map." — the OpenFirst hero illustration.
    A folded paper map with the places that matter and one calm route
    between them, starting at the envelope (the plan). Drawn to the brand:
    ink + heaven-blue strokes (round caps, width 2–3), soft washes, no text.
  -->
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d2b3a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ============ the folded map sheet ============ -->
  <g filter="url(#soft)">
    <path d="M84 96 L232 74 L392 92 L548 70 L560 420 L400 444 L244 424 L96 448 Z" fill="#fbfcfe"/>
    <path d="M84 96 L232 74 L392 92 L548 70 L560 420 L400 444 L244 424 L96 448 Z" stroke="#c9d6e6" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- fold creases -->
  <path d="M232 74 L244 424" stroke="#dbe4f0" stroke-width="2"/>
  <path d="M392 92 L400 444" stroke="#dbe4f0" stroke-width="2"/>
  <!-- crease shading -->
  <path d="M232 74 L244 424 L96 448 L84 96 Z" fill="#3C6FB2" opacity="0.03"/>
  <path d="M392 92 L400 444 L548 70 L560 420 Z" fill="#3C6FB2" opacity="0.03"/>

  <!-- faint contour lines, map-feel -->
  <path d="M120 380 q60 -28 118 -8 q52 18 96 -6" stroke="#e4ebf5" stroke-width="2" stroke-linecap="round"/>
  <path d="M132 402 q66 -24 128 -4 q48 14 88 -8" stroke="#e4ebf5" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 120 q44 -18 84 2" stroke="#e4ebf5" stroke-width="2" stroke-linecap="round"/>

  <!-- ============ the route (accent, dashed) ============ -->
  <path d="M158 322
           C 200 292, 216 250, 262 238
           C 310 226, 330 268, 372 250
           C 416 232, 420 180, 468 158"
        stroke="#3C6FB2" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12"/>

  <!-- ============ START: the envelope (the plan) ============ -->
  <g transform="translate(118,300)">
    <rect x="0" y="0" width="64" height="46" fill="#eef4fb"/>
    <!-- envelope, the logo's cut corner -->
    <path d="M4 6 H38 M4 6 V40 H58 V26" stroke="#3C6FB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 6 H58 V16" stroke="#3C6FB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 6 L30 24 L52 10" stroke="#3C6FB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ the home ============ -->
  <g transform="translate(236,196)">
    <path d="M2 26 L26 4 L50 26" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 24 V52 H44 V24" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 52 V38 H31 V52" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="24" width="36" height="28" fill="#3C6FB2" opacity="0.06"/>
    <!-- chimney smoke: someone is home -->
    <path d="M38 8 q4 -6 0 -11 q-3 -5 1 -9" stroke="#c9d6e6" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- the safe, tucked by the home -->
  <g transform="translate(306,262)">
    <rect x="0" y="0" width="34" height="30" stroke="#33404f" stroke-width="3" stroke-linejoin="round" fill="#eef4fb"/>
    <circle cx="17" cy="15" r="7" stroke="#33404f" stroke-width="2.6"/>
    <path d="M17 15 L17 9.6" stroke="#33404f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M5 30 v5 M29 30 v5" stroke="#33404f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ============ the bank ============ -->
  <g transform="translate(414,278)">
    <path d="M0 16 L23 2 L46 16" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 22 V44 M15 22 V44 M27 22 V44 M38 22 V44" stroke="#33404f" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 22 H46 M-2 48 H48" stroke="#33404f" stroke-width="3" stroke-linecap="round"/>
    <rect x="2" y="22" width="42" height="22" fill="#3C6FB2" opacity="0.05"/>
  </g>

  <!-- ============ the cabin in the other country ============ -->
  <g transform="translate(452,102)">
    <path d="M0 26 L20 6 L40 26" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 24 V42 H35 V24" stroke="#33404f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 42 V32 H21 V42" stroke="#33404f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="5" y="24" width="30" height="18" fill="#3C6FB2" opacity="0.06"/>
  </g>
  <!-- mountains behind the cabin -->
  <path d="M508 132 L530 100 L552 132 M524 132 L544 106 L562 132"
        stroke="#c9d6e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trees -->
  <g stroke="#7fa3cd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 176 l9 -18 l9 18 Z M205 176 v9" fill="#eef4fb"/>
    <path d="M356 340 l10 -20 l10 20 Z M366 340 v10" fill="#eef4fb"/>
    <path d="M154 236 l8 -16 l8 16 Z M162 236 v8" fill="#eef4fb"/>
  </g>

  <!-- the key, near the route -->
  <g transform="translate(348,196) rotate(-24)">
    <circle cx="0" cy="0" r="7" stroke="#3C6FB2" stroke-width="2.8"/>
    <path d="M6 3 L26 14 M18 10 l-2.4 4.6 M23 12.6 l-2.4 4.6" stroke="#3C6FB2" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- ============ DESTINATION: heart-marked (the family), not X ============ -->
  <g transform="translate(468,144)">
    <path d="M0 5 C 0 -1.6, 9 -1.6, 9 4 C 9 -1.6, 18 -1.6, 18 5 C 18 11, 9 17.4, 9 17.4 C 9 17.4, 0 11, 0 5 Z"
          fill="#3C6FB2" opacity="0.85"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(140,132)">
    <circle cx="0" cy="0" r="21" stroke="#c9d6e6" stroke-width="2.4"/>
    <path d="M0 -14 L4.5 0 L0 14 L-4.5 0 Z" fill="#3C6FB2" opacity="0.75"/>
    <path d="M-12 0 H-17 M12 0 H17 M0 -17 V-21 M0 17 V21" stroke="#c9d6e6" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- a few quiet waypoint dots -->
  <g fill="#3C6FB2" opacity="0.5">
    <circle cx="262" cy="238" r="3.4"/>
    <circle cx="372" cy="250" r="3.4"/>
  </g>
</svg>
