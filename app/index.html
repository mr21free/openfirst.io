<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The strict Content-Security-Policy is injected only into the production
      build (see vite.config.js), where all JS/CSS/fonts are inlined into this
      one file. It is deliberately NOT present in dev, because Vite serves its
      client and modules over the network during `npm run dev`.
    -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3C6FB2" />
    <meta name="description" content="OpenFirst is a local-first life package builder and reader for inheritance, recovery, and handover plans." />
    <title>OpenFirst — a calm place to read a life package</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
