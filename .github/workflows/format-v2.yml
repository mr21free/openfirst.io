name: Format v2 recovery check

# Keeps FORMAT.md's durability claim honest for Container Format v2: recover.js
# (canonical, zero dependencies) and recover.py (secondary worked example)
# must agree, byte-for-byte, on every checked-in v2 fixture, forever. Mirrors
# format-v1.yml exactly — see that workflow for v1 (unprotected saves always
# stay v1, so this one only has protected/passphrase fixtures).
on:
  push:
    paths:
      - 'app/recover.js'
      - 'app/recover.py'
      - 'app/FORMAT.md'
      - 'app/schema/fixtures/format-v2/**'
      - '.github/workflows/format-v2.yml'
  pull_request:
    paths:
      - 'app/recover.js'
      - 'app/recover.py'
      - 'app/FORMAT.md'
      - 'app/schema/fixtures/format-v2/**'
      - '.github/workflows/format-v2.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install recover.py's one dependency
        run: pip install cryptography

      - name: Regenerate fixtures and confirm nothing drifted
        working-directory: app/schema/fixtures/format-v2
        run: |
          node generate.mjs
          git diff --exit-code -- . \
            || (echo '::error::Committed fixtures do not match generate.mjs output — regenerate and commit them.' && exit 1)

      - name: Cross-check recover.js against recover.py on every fixture
        working-directory: app
        run: npm run test:format-v2
